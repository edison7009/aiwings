# Portable (no-install) Windows build, added to a release's assets: the bare Wings.exe, no zip — download
# and double-click. Needs the WebView2 runtime, which Windows 10/11 already have. macOS gets no portable
# build: a .app is a folder and can only ship in an archive, and the .dmg already opens to a ready app.
# Called by the Release workflow once the installers are up, or run by hand for an existing tag.
# (A release created with GITHUB_TOKEN does not fire release events, so it cannot listen for one.)
name: Portable

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to add portable builds to (e.g. v0.0.1)
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x64
    runs-on: ${{ matrix.platform }}
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci

      - name: Build
        shell: pwsh
        run: |
          npx tauri build --target ${{ matrix.target }} --no-bundle
          $version = $env:TAG.TrimStart('v')
          Copy-Item "src-tauri/target/${{ matrix.target }}/release/wings.exe" "Wings-$version-windows-${{ matrix.arch }}.exe"

      - name: Upload to the release
        shell: bash
        run: gh release upload "$TAG" Wings-*-windows-*.exe --clobber
