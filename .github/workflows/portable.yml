# Portable (no-install) builds, added to a release's assets:
#   macOS:   Wings.app in a zip — unzip and run, or drag it anywhere.
#   Windows: the bare Wings.exe in a zip — needs the WebView2 runtime, which Windows 10/11 already have.
# Called by the Release workflow once the installers are up, or run by hand for an existing tag.
# (A release created with GITHUB_TOKEN does not fire release events, so it cannot listen for one.)
name: Portable

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to add portable builds to (e.g. v0.0.1)
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            arch: aarch64
          - platform: macos-latest
            target: x86_64-apple-darwin
            arch: x64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x64
    runs-on: ${{ matrix.platform }}
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci

      - name: Build and zip (macOS)
        if: runner.os == 'macOS'
        run: |
          npx tauri build --target ${{ matrix.target }} --bundles app
          VERSION="${TAG#v}"
          cd src-tauri/target/${{ matrix.target }}/release/bundle/macos
          ditto -c -k --keepParent Wings.app "$GITHUB_WORKSPACE/Wings-$VERSION-macos-${{ matrix.arch }}-portable.zip"

      - name: Build and zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npx tauri build --target ${{ matrix.target }} --no-bundle
          $version = $env:TAG.TrimStart('v')
          $dir = "Wings-$version-windows-${{ matrix.arch }}-portable"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item "src-tauri/target/${{ matrix.target }}/release/wings.exe" "$dir/Wings.exe"
          Compress-Archive -Path "$dir/*" -DestinationPath "$dir.zip"

      - name: Upload to the release
        shell: bash
        run: gh release upload "$TAG" Wings-*-portable.zip --clobber
